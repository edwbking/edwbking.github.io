<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Portal Photo Frame</title>
    <!-- Web App Manifest capabilities for clean fullscreen launching -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Include NoSleep.js from CDN to prevent screen dimming -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Full-screen background image container */
        .background-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://pixelcaster.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Widget container positioning the clock in the top-right corner */
        .clock-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        iframe {
            display: block;
            border: none;
        }

        /* Ambient, clean button to activate the Wake Lock */
        .wake-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .wake-btn.active {
            background-color: rgba(46, 204, 113, 0.4);
            border-color: #2ecc71;
            color: #e8f8f5;
        }
    </style>
</head>
<body>

    <!-- Background Image -->
    <div class="background-frame"></div>

    <!-- Rolex Clock Overlay -->
    <div class="clock-container">
        <iframe 
            src="https://rolex.com" 
            width="270" 
            height="90" 
            frameborder="0" 
            scrolling="no">
        </iframe>
    </div>

    <!-- Wake Lock button (Browsers require a tap gesture to activate nosleep) -->
    <button id="wakeBtn" class="wake-btn">🔒 Tap to Keep Awake</button>

    <script>
        const noSleep = new NoSleep();
        const wakeBtn = document.getElementById('wakeBtn');
        let isAwake = false;

        wakeBtn.addEventListener('click', function() {
            if (!isAwake) {
                noSleep.enable();
                wakeBtn.textContent = "🔓 Frame Stay-Awake Active";
                wakeBtn.classList.add('active');
                isAwake = true;
                
                // Optional: Fade out the button after 5 seconds so it doesn't block the view
                setTimeout(() => {
                    wakeBtn.style.opacity = '0.1';
                }, 5000);
            } else {
                noSleep.disable();
                wakeBtn.textContent = "🔒 Tap to Keep Awake";
                wakeBtn.classList.remove('active');
                wakeBtn.style.opacity = '1';
                isAwake = false;
            }
        });

        // Automatically brings back wake-lock state if saved in session across 60s refreshes
        if (sessionStorage.getItem('wakeActive') === 'true') {
            // Browsers still require user gesture post-refresh, so we prompt them
            wakeBtn.textContent = "👉 Tap to Resume Stay-Awake";
        }

        wakeBtn.addEventListener('click', () => {
            sessionStorage.setItem('wakeActive', isAwake);
        });

        // Auto-refresh the page every 60 seconds to update the webcam backdrop
        setTimeout(function() {
            window.location.reload();
        }, 60000);
    </script>
</body>
</html>
