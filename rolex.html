<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Portal Photo Frame</title>
    <style>
        /* Reset margins and ensure full screen utilization */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Full-screen background image container */
        .background-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.pixelcaster.com/public.pixelcaster.com/snapshots/wyndham-grand-jupiter/latest.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Widget container positioning the clock in the top-right corner */
        .clock-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        iframe {
            display: block;
            border: none;
        }
    </style>
    <script>
        // Refresh the page entirely every 60 seconds to pull the latest webcam image
        setTimeout(function() {
            window.location.reload();
        }, 60000);
    </script>
</head>
<body>

    <!-- Background Image -->
    <div class="background-frame"></div>

    <!-- Rolex Clock Overlay -->
    <div class="clock-container">
        <iframe 
            src="https://static.rolex.com/clocks/2020/explorers_all_HTML_270x90/rolex.html#Your_Time" 
            width="270" 
            height="90" 
            frameborder="0" 
            scrolling="no">
        </iframe>
    </div>

</body>
</html>
