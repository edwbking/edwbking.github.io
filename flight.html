<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Radar (CORS Fix)</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --accent:#3b82f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        
        /* Header & Button */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        #kiosk-btn { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 1rem; }
        #kiosk-btn.active { background: #d32f2f; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .photo-box { height: 160px; background: #000; position: relative; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; }
        
        .info { padding: 12px; }
        .flight-main { font-size: 1.4rem; font-weight: 800; color: var(--accent); display: flex; justify-content: space-between; }
        .reg-badge { font-size: 0.75rem; background: #333; color: #aaa; padding: 2px 6px; border-radius: 4px; align-self: center; }
        .stats { display: flex; justify-content: space-between; margin-top: 8px; color: #ccc; font-size: 0.9rem; }

        /* Logs */
        #logs { margin-top: 30px; font-family: monospace; font-size: 0.7rem; color: #555; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0">✈️ Nearby Traffic</h2>
            <small id="gps-status" style="color: #888">Waiting for GPS...</small>
        </div>
        <button id="kiosk-btn" onclick="toggleKiosk()">📺 Start Kiosk</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="logs">System Log:<br></div>

    <script>
        // CONFIG
        const RADIUS_NM = 50; 
        const PROXY_BASE = "https://allorigins.win"; // The CORS Fixer

        // STATE
        let noSleep = new NoSleep();
        let isKiosk = false;
        let photoCache = {};

        // UTILS
        function log(msg) {
            const logEl = document.getElementById('logs');
            logEl.innerHTML += `> ${msg}<br>`;
            console.log(msg);
        }

        function toggleKiosk() {
            const btn = document.getElementById('kiosk-btn');
            if (!isKiosk) {
                noSleep.enable();
                document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
                btn.textContent = "🛑 Stop Kiosk";
                btn.classList.add('active');
                isKiosk = true;
            } else {
                noSleep.disable();
                document.exitFullscreen?.();
                btn.textContent = "📺 Start Kiosk";
                btn.classList.remove('active');
                isKiosk = false;
            }
        }

        // --- DATA FETCHING (Always Proxied) ---

        // 1. Helper to fetch via Proxy
        async function fetchProxy(targetUrl) {
            // Encode the target URL and wrap it in the proxy
            const finalUrl = PROXY_BASE + encodeURIComponent(targetUrl);
            const res = await fetch(finalUrl);
            if (!res.ok) throw new Error(`Proxy Error ${res.status}`);
            
            const envelope = await res.json();
            // AllOrigins puts the actual response in "contents"
            if (!envelope.contents) throw new Error("Empty Proxy Response");
            
            // Try to parse the inner JSON (the actual flight data)
            return JSON.parse(envelope.contents); 
        }

        // 2. Main Logic
        function init() {
            if(!navigator.geolocation) return log("❌ Geolocation not supported");
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(3);
                    const lon = pos.coords.longitude.toFixed(3);
                    document.getElementById('gps-status').textContent = `${lat}, ${lon}`;
                    log(`✅ GPS Lock: ${lat}, ${lon}`);
                    
                    // Start Loop
                    updateFlights(lat, lon);
                    setInterval(() => updateFlights(lat, lon), 30000);
                },
                (err) => {
                    log("❌ GPS Access Denied: " + err.message);
                    alert("Please allow Location Access to see nearby planes.");
                }
            );
        }

        async function updateFlights(lat, lon) {
            log("📡 Fetching Flights...");
            const grid = document.getElementById('grid');
            
            try {
                // Using v2 API via Proxy
                const url = `https://adsb.fi{lat}/lon/${lon}/dist/${RADIUS_NM}`;
                
                const data = await fetchProxy(url); // <--- ROUTED THROUGH PROXY
                const list = data.ac || data.aircraft || [];
                
                log(`✅ Found ${list.length} aircraft`);
                
                if(list.length === 0) {
                    grid.innerHTML = '<p style="padding:20px; color:#666">No aircraft within range.</p>';
                    return;
                }

                // Render
                grid.innerHTML = '';
                list.sort((a,b) => (b.alt_baro||0) - (a.alt_baro||0)); // Sort by Altitude

                for (const p of list) {
                    const hex = p.hex;
                    const callsign = (p.flight || p.r || hex).trim();
                    const alt = p.alt_baro ? p.alt_baro + " ft" : "GND";
                    
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.innerHTML = `
                        <div class="photo-box" id="img-${hex}">
                            <div class="photo-placeholder">Loading...</div>
                        </div>
                        <div class="info">
                            <div class="flight-main">
                                <a href="https://adsb.fi{hex}" style="color:inherit;text-decoration:none">${callsign}</a>
                                <span class="reg-badge">${p.r || hex}</span>
                            </div>
                            <div class="stats">
                                <span>✈️ ${p.t || 'N/A'}</span>
                                <span>📏 ${alt}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(el);
                    
                    // Load Photo (Also Proxied)
                    loadPhoto(hex);
                }

            } catch (err) {
                log("❌ Fetch Error: " + err.message);
            }
        }

        async function loadPhoto(hex) {
            if (photoCache[hex]) {
                injectPhoto(hex, photoCache[hex]);
                return;
            }

            try {
                // PlaneSpotters API is strict, so we PROXY this too
                const url = `https://planespotters.net{hex}`;
                const data = await fetchProxy(url);

                if (data.photos && data.photos.length > 0) {
                    const src = data.photos[0].thumbnail_large.src;
                    photoCache[hex] = src;
                    injectPhoto(hex, src);
                } else {
                    document.getElementById(`img-${hex}`).innerHTML = 
                        '<div class="photo-placeholder">No Photo</div>';
                }
            } catch (e) {
                // Quietly fail for photos
                document.getElementById(`img-${hex}`).innerHTML = 
                    '<div class="photo-placeholder">N/A</div>';
            }
        }

        function injectPhoto(hex, src) {
            const box = document.getElementById(`img-${hex}`);
            if(box) box.innerHTML = `<img src="${src}" loading="lazy">`;
        }

        // Boot
        init();

    </script>
</body>
</html>
