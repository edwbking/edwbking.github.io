<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Flight Radar v2</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #3b82f6;
            --muted: #6b7280;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .photo-box { height: 180px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; }
        
        .flight-id { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; }
        .reg { font-size: 0.8rem; background: #333; padding: 2px 6px; border-radius: 4px; color: #aaa; align-self: center; }
        .stat-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.95rem; color: #ccc; }
        
        #error-banner { 
            background: #7f1d1d; color: #fecaca; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; 
        }
        button { cursor: pointer; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="error-banner">
        <strong>⚠️ Connection Failed:</strong> <span id="error-msg"></span><br>
        <small>If this says "NetworkError" or "CORS", see the instructions below.</small>
        <div style="margin-top:10px">
            <button onclick="useProxy()">Try with Proxy (Fix CORS)</button>
        </div>
    </div>

    <div class="header">
        <div>
            <h2 style="margin:0">✈️ Nearby Traffic</h2>
            <small id="coords">Locating...</small>
        </div>
        <div id="status">Ready</div>
    </div>

    <div id="grid" class="grid"></div>

    <script>
        // CONFIG
        const RADIUS_NM = 50; 
        let USE_PROXY = false; // Toggle if CORS fails
        
        // ELEMENT REFS
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');
        const errorBanner = document.getElementById('error-banner');
        const errorMsg = document.getElementById('error-msg');
        const coords = document.getElementById('coords');

        // CACHE
        const photoCache = {};

        function init() {
            if(!navigator.geolocation) return alert("Geolocation not supported");
            navigator.geolocation.getCurrentPosition(success, fail);
        }

        function success(pos) {
            const { latitude: lat, longitude: lon } = pos.coords;
            coords.textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
            fetchFlights(lat, lon);
            setInterval(() => fetchFlights(lat, lon), 15000);
        }

        function fail() {
            coords.textContent = "Location Denied";
            alert("Please allow location access to find nearby planes.");
        }

        async function fetchFlights(lat, lon) {
            status.textContent = "Fetching...";
            
            // CORRECTED ENDPOINT (v3)
            let url = `https://adsb.fi{lat}/lon/${lon}/dist/${RADIUS_NM}`;
            
            // PROXY MODE (If normal fetch fails)
            if (USE_PROXY) {
                url = `https://allorigins.win{encodeURIComponent(url)}`;
            }

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`API Error ${res.status}`);
                
                let data = await res.json();
                
                // Handle Proxy Response Structure
                if (USE_PROXY) data = JSON.parse(data.contents);

                // Handle different keys (v3 usually uses 'aircraft' or 'ac')
                const list = data.aircraft || data.ac || [];
                
                render(list);
                status.textContent = `Updated: ${new Date().toLocaleTimeString()} (${list.length} planes)`;
                errorBanner.style.display = 'none';

            } catch (err) {
                console.error(err);
                status.textContent = "Error";
                errorBanner.style.display = 'block';
                errorMsg.textContent = err.message + ". Your browser blocked the request.";
            }
        }

        window.useProxy = function() {
            USE_PROXY = true;
            errorMsg.textContent = "Retrying with Proxy...";
            navigator.geolocation.getCurrentPosition((pos) => {
                fetchFlights(pos.coords.latitude, pos.coords.longitude);
            });
        }

        async function render(list) {
            grid.innerHTML = '';
            
            // Sort by altitude
            list.sort((a,b) => (b.alt_baro||0) - (a.alt_baro||0));

            if(list.length === 0) {
                grid.innerHTML = '<p>No aircraft found nearby.</p>';
                return;
            }

            for (const p of list) {
                const hex = p.hex;
                const callsign = (p.flight || p.r || hex).trim();
                const alt = p.alt_baro ? p.alt_baro + ' ft' : 'GND';
                const spd = p.gs ? Math.round(p.gs) + ' kts' : '-';
                
                const card = document.createElement('div');
                card.className = 'card';
                
                // Photo Placeholder
                card.innerHTML = `
                    <div class="photo-box" id="img-${hex}">Loading...</div>
                    <div class="info">
                        <div class="flight-id">
                            <a href="https://adsb.fi{hex}" target="_blank" style="color:inherit;text-decoration:none">${callsign}</a>
                            <span class="reg">${p.r || hex}</span>
                        </div>
                        <div class="stat-row"><span>Alt: ${alt}</span> <span>Spd: ${spd}</span></div>
                        <div class="stat-row"><span>Type: ${p.t || 'Unknown'}</span></div>
                    </div>
                `;
                grid.appendChild(card);
                
                // Lazy Load Photo
                loadPhoto(hex);
            }
        }

        async function loadPhoto(hex) {
            const box = document.getElementById(`img-${hex}`);
            if(photoCache[hex]) {
                box.innerHTML = `<img src="${photoCache[hex]}">`;
                return;
            }

            try {
                // Planespotters API
                const r = await fetch(`https://planespotters.net{hex}`);
                const d = await r.json();
                if(d.photos && d.photos.length > 0) {
                    const src = d.photos[0].thumbnail_large.src;
                    photoCache[hex] = src;
                    box.innerHTML = `<img src="${src}">`;
                } else {
                    box.innerHTML = '<span style="color:#555">No Photo</span>';
                    photoCache[hex] = null;
                }
            } catch(e) {
                box.innerHTML = '<span style="color:#555">Error</span>';
            }
        }

        init();
    </script>
</body>
</html>
