<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidGrid Launcher</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        /* Click Overlay Setup */
        #launchZone {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            background: #111;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
        }
        /* Hidden Fullscreen Frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="launchZone">
        <h1>Welcome to VidGrid</h1>
        <p>Click anywhere to launch the stream setup in full screen</p>
        <button class="btn">Enter Full Screen</button>
    </div>

    <!-- The frame must include allow="fullscreen" permissions -->
    <iframe id="vidgridFrame" src="https://tk.gg" allow="fullscreen"></iframe>

    <script>
        const launchZone = document.getElementById('launchZone');
        const iframe = document.getElementById('vidgridFrame');

        launchZone.addEventListener('click', () => {
            const docElm = document.documentElement;
            
            // Trigger native fullscreen on the root document
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.webkitRequestFullscreen) { 
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) { 
                docElm.msRequestFullscreen();
            }

            // Swap visibility: Hide the launch button, display the embedded site
            launchZone.style.display = 'none';
            iframe.style.display = 'block';
        });
    </script>

</body>
</html>
