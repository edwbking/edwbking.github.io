<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidGrid Launch</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            cursor: pointer;
            padding: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }
        .container:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="container" id="launchZone">
        <h1>Welcome to VidGrid</h1>
        <p>Click anywhere or use the button below to launch in full screen</p>
        <button class="btn">Enter Full Screen</button>
    </div>

    <script>
        const targetUrl = "https://vidgrid.tk.gg";
        const launchZone = document.getElementById('launchZone');

        launchZone.addEventListener('click', () => {
            const docElm = document.documentElement;
            
            // Request Full Screen
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.mozRequestFullScreen) { /* Firefox */
                docElm.mozRequestFullScreen();
            } else if (docElm.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) { /* IE/Edge */
                docElm.msRequestFullscreen();
            }

            // Short delay to allow the browser to transition to full screen before redirecting
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        });
    </script>

</body>
</html>
