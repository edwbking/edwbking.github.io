<!-- 1. Load the NoSleep Library (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>

<!-- 2. The Activator Overlay -->
<div id="wake-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; display:flex; justify-content:center; align-items:center; z-index:9999; cursor:pointer;">
  <div style="text-align:center;">
    <h2>Tap to Start Dashboard</h2>
    <p>(Enables Always-On Mode)</p>
  </div>
</div>

<!-- 3. The Logic -->
<script>
  document.getElementById('wake-overlay').addEventListener('click', function() {
    // Initialize NoSleep
    var noSleep = new NoSleep();
    noSleep.enable();
    
    // Hide the overlay
    this.style.display = 'none';
    console.log('Wake Lock Active: Portal will not sleep.');
  });
</script>
