<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla FL511 Traffic Cam Viewer</title>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #cc0000; /* Tesla Red */
            --button-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        input, button {
            background-color: var(--button-bg);
            color: white;
            border: 1px solid #444;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            margin: 5px;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3a3a3a;
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        button.primary:hover {
            background-color: #b30000;
        }

        #status {
            margin: 10px 0;
            font-weight: bold;
            color: #ffcc00;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .cam-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }

        .cam-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #000;
            display: block;
        }

        .cam-info {
            padding: 12px;
            text-align: left;
        }

        .cam-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cam-miles {
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>FL511 Nearby Traffic Cameras</h1>
    <div class="subtitle">Optimized for Tesla Model 3 Web Browser</div>

    <div class="controls">
        <button class="primary" onclick="getBrowserLocation()">📡 Use Current GPS</button>
        <span style="margin: 0 10px; color:#555;">or manual:</span>
        <input type="text" id="manualLat" placeholder="Latitude (e.g. 28.5383)" style="width: 160px;">
        <input type="text" id="manualLng" placeholder="Longitude (e.g. -81.3792)" style="width: 160px;">
        <button onclick="useManualLocation()">Load Coords</button>
    </div>

    <div id="status">Click "Use Current GPS" or enter coordinates to begin.</div>
    <div class="cam-grid" id="camGrid"></div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let refreshInterval = null;
        let cameraDataCache = [];

        // Attempt to pull live telemetry from Tesla browser GPS
        function getBrowserLocation() {
            document.getElementById('status').innerText = "Requesting GPS location...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        document.getElementById('manualLat').value = currentLat.toFixed(4);
                        document.getElementById('manualLng').value = currentLng.toFixed(4);
                        fetchNearbyCameras();
                    },
                    (error) => {
                        document.getElementById('status').innerText = "GPS access denied or unavailable. Please enter coordinates manually.";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('status').innerText = "Geolocation not supported by browser.";
            }
        }

        function useManualLocation() {
            const lat = parseFloat(document.getElementById('manualLat').value);
            const lng = parseFloat(document.getElementById('manualLng').value);
            if (isNaN(lat) || isNaN(lng)) {
                document.getElementById('status').innerText = "Please enter valid Latitude and Longitude numeric values.";
                return;
            }
            currentLat = lat;
            currentLng = lng;
            fetchNearbyCameras();
        }

        // Query the live FL511 ArcGIS Feature Server endpoint
        async function fetchNearbyCameras() {
            if (!currentLat || !currentLng) return;
            
            document.getElementById('status').innerText = "Querying FL511 database...";
            
            // Define distance threshold (~15 miles in degrees approximation)
            const degreeBuffer = 0.22; 
            const minLng = currentLng - degreeBuffer;
            const maxLng = currentLng + degreeBuffer;
            const minLat = currentLat - degreeBuffer;
            const maxLat = currentLat + degreeBuffer;

            // Official FL511 Layer 0 Spatial query URL
            const apiUrl = `https://arcgis.com{minLng},${minLat},${maxLng},${maxLat}&geometryType=esriGeometryEnvelope&spatialRel=esriSpatialRelIntersects&outFields=name,url,latitude,longitude&returnGeometry=false&f=json`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (!data.features || data.features.length === 0) {
                    document.getElementById('status').innerText = "No FL511 traffic cameras found within 15 miles of this location.";
                    document.getElementById('camGrid').innerHTML = "";
                    clearInterval(refreshInterval);
                    return;
                }

                // Process features and calculate precise distance
                cameraDataCache = data.features.map(f => {
                    const attr = f.attributes;
                    const distance = haversineDistance(currentLat, currentLng, attr.latitude, attr.longitude);
                    return {
                        name: attr.name || "Unknown Camera Location",
                        url: attr.url,
                        distance: distance
                    };
                });

                // Sort cameras closest to the car first
                cameraDataCache.sort((a, b) => a.distance - b.distance);
                
                document.getElementById('status').innerText = `Found ${cameraDataCache.length} cameras nearby. Autorefreshing every 10s.`;
                
                renderGrid();
                setupAutoRefresh();

            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Error loading FL511 server data. Ensure you are online and in Florida.";
            }
        }

        // Render cards into the dark HTML grid layout
        function renderGrid() {
            const grid = document.getElementById('camGrid');
            const timestamp = new Date().getTime(); // Prevents image caching
            
            grid.innerHTML = cameraDataCache.map(cam => {
                // Ensure URLs use HTTPS to prevent mixed-content blocks in browser
                const secureUrl = cam.url.replace("http://", "https://");
                const dynamicImg = `${secureUrl}?t=${timestamp}`;
                
                return `
                    <div class="cam-card">
                        <img src="${dynamicImg}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\' width=\'100%\' height=\'100%\' viewBox=\'0 0 100 100\'><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23666\' font-size=\'10\'>Camera Feed Offline</text></svg>';" alt="Traffic Camera">
                        <div class="cam-info">
                            <div class="cam-title" title="${cam.name}">${cam.name}</div>
                            <div class="cam-miles">📍 ${cam.distance.toFixed(1)} miles away</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Set interval to flush image memory cache and show latest snapshot
        function setupAutoRefresh() {
            clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                renderGrid();
            }, 10000); // 10 second refresh loop
        }

        // Formula to accurately calculate distance from car to camera coordinates
        function haversineDistance(lat1, lon1, lat2, lon2) {
