<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL511 Traffic Camera Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
        }
        .refresh-badge {
            background-color: #0076a3;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .timer-text {
            color: #aaaaaa;
        }
        .map-frame-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 50px);
            background-color: #242424;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>FL511 Traffic Feed: Kanner Hwy to Northlake Blvd</h1>
        <div class="status-container">
            <span class="timer-text">Next update in: <span id="countdown">60</span>s</span>
            <span class="refresh-badge">Auto-Refreshing (1m)</span>
        </div>
    </header>

    <div class="map-frame-container">
        <!-- Official FL511 Embedded Map configured to the custom bounding region -->
        <iframe 
            id="fl511-map"
            src="https://fl511.com" 
            allowfullscreen>
         iframe>
    </div>

    <script>
        // Set update frequency interval to exactly 60 seconds (60000 milliseconds)
        const refreshIntervalSeconds = 60;
        let timeRemaining = refreshIntervalSeconds;
        
        const countdownElement = document.getElementById('countdown');
        const mapFrame = document.getElementById('fl511-map');

        // Countdown timer animation loop
        setInterval(() => {
            timeRemaining--;
            if (timeRemaining <= 0) {
                timeRemaining = refreshIntervalSeconds;
                refreshMap();
            }
            countdownElement.textContent = timeRemaining;
        }, 1000);

        // Function to refresh the embedded map content safely
        function refreshMap() {
            // Appending a temporary timestamp parameter bypasses the browser cache 
            // and forces the iframe to fetch raw, real-time image snapshots from the servers.
            const currentSrc = mapFrame.src.split('&_ts=')[0];
            const newTimestamp = new Date().getTime();
            mapFrame.src = `${currentSrc}&_ts=${newTimestamp}`;
            console.log('FL511 Traffic Map Feed Updated: ' + new Date().toLocaleTimeString());
        }
    </script>
</body>
</html>
